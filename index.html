<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/ratify-mark.svg" />

    <title>Ratify — approve pull requests in three keystrokes</title>
    <meta
      name="description"
      content="A keyboard-driven macOS review inbox for people who review a lot of code. The queue is always loaded, the top pull request is already selected, and every review action is one keystroke."
    />
    <link rel="canonical" href="https://ratify.cmrd.dev/" />
    <!-- Both palettes, so the browser does not paint a white gutter under a
         dark page (or the reverse) while the stylesheet is still in flight.
         theme-color is then kept in step with the switcher by src/theme.js,
         which reads the canvas back out of the stylesheet rather than
         restating it. -->
    <meta name="theme-color" content="#09090B" />
    <meta name="color-scheme" content="dark light" />

    <!-- Render-blocking on purpose, and classic rather than a module for the
         same reason: modules are deferred, and a deferred theme is a theme
         someone watches arrive. It is served from public/ so `script-src
         'self'` already covers it — no inline hash to keep in step with the
         CSP. See the file's own header. -->
    <script src="/theme-boot.js"></script>

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ratify" />
    <meta property="og:url" content="https://ratify.cmrd.dev/" />
    <meta property="og:title" content="Ratify — approve pull requests in three keystrokes" />
    <meta
      property="og:description"
      content="A keyboard-driven macOS review inbox for people who review a lot of code. Built for large pull requests, not just easy ones."
    />
    <meta property="og:image" content="https://ratify.cmrd.dev/shots/inbox.webp" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Hanken Grotesk is the wordmark face and is only ever the wordmark;
         Instrument Sans carries prose, JetBrains Mono carries anything a
         machine made — keys, counts, paths, identifiers. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
